version: '3.8'

services:
  # Database Services
  mongodb:
    image: mongo:7.0
    container_name: personal-shopper-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - personal-shopper-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: personal-shopper-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password123
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - personal-shopper-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Microservices
  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: personal-shopper-customer-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/customer_db?authSource=admin
      DB_NAME: customer_db
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
    ports:
      - '3001:3001'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - personal-shopper-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: personal-shopper-product-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/product_db?authSource=admin
      DB_NAME: product_db
      CUSTOMER_SERVICE_URL: http://customer-service:3001
      ORDER_SERVICE_URL: http://order-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
    ports:
      - '3002:3002'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - personal-shopper-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3002/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: personal-shopper-order-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/order_db?authSource=admin
      DB_NAME: order_db
      CUSTOMER_SERVICE_URL: http://customer-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3004
      HTTP_TIMEOUT: 5000
    ports:
      - '3003:3003'
    depends_on:
      mongodb:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - personal-shopper-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3003/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: personal-shopper-payment-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/payment_db?authSource=admin
      DB_NAME: payment_db
      CUSTOMER_SERVICE_URL: http://customer-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      RABBITMQ_URL: amqp://admin:password123@rabbitmq:5672
      RABBITMQ_QUEUE: transaction_queue
      RABBITMQ_EXCHANGE: payment_exchange
    ports:
      - '3004:3004'
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - personal-shopper-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3004/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker-service:
    build:
      context: ./worker-service
      dockerfile: Dockerfile
    container_name: personal-shopper-worker-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/transaction_db?authSource=admin
      DB_NAME: transaction_db
      RABBITMQ_URL: amqp://admin:password123@rabbitmq:5672
      RABBITMQ_QUEUE: transaction_queue
      RABBITMQ_EXCHANGE: payment_exchange
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - personal-shopper-network

networks:
  personal-shopper-network:
    driver: bridge
    name: personal-shopper-network

volumes:
  mongodb_data:
    name: personal-shopper-mongodb-data
  rabbitmq_data:
    name: personal-shopper-rabbitmq-data
