version: '3.8'

services:
  # Database Services
  mongodb:
    image: mongo:7.0
    container_name: personal-shopper-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - '27017:27017'
    volumes:
      - mongodb_dev_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - personal-shopper-dev-network

  # Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: personal-shopper-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password123
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    networks:
      - personal-shopper-dev-network

networks:
  personal-shopper-dev-network:
    driver: bridge
    name: personal-shopper-dev-network

volumes:
  mongodb_dev_data:
    name: personal-shopper-mongodb-dev-data
  rabbitmq_dev_data:
    name: personal-shopper-rabbitmq-dev-data
